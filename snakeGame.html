<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="images/avatar.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(
          135deg,
          #1a1a2e 0%,
          #16213e 50%,
          #0f3460 100%
        );
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #fff;
      }
      h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        color: #4ade80;
        text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
      }
      .score-board {
        display: flex;
        gap: 30px;
        margin-bottom: 15px;
        font-size: 1.2rem;
      }
      .score-item {
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 20px;
        border-radius: 10px;
        border: 1px solid rgba(74, 222, 128, 0.3);
      }
      .score-item span {
        color: #4ade80;
        font-weight: bold;
      }
      #gameCanvas {
        display: block;
        width: min(400px, calc(100vw - 32px));
        height: auto;
        aspect-ratio: 1;
        border: 3px solid #4ade80;
        border-radius: 12px;
        background: #0a0a1a;
        box-shadow: 0 0 30px rgba(74, 222, 128, 0.3);
        touch-action: none;
      }
      .mobile-controls {
        display: none;
      }
      .pause-button {
        margin-top: 18px;
        padding: 9px 22px;
        border: 1px solid rgba(74, 222, 128, 0.55);
        border-radius: 8px;
        color: #4ade80;
        background: rgba(74, 222, 128, 0.08);
        font: inherit;
        font-size: 0.95rem;
        cursor: pointer;
        transition:
          color 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease,
          transform 180ms ease;
      }
      .pause-button:hover,
      .pause-button:focus-visible {
        color: #0a0a1a;
        background: #4ade80;
        outline: none;
        transform: translateY(-2px);
        box-shadow: 0 0 18px rgba(74, 222, 128, 0.45);
      }
      .controls {
        margin-top: 20px;
        text-align: center;
        color: #94a3b8;
        font-size: 0.95rem;
      }
      .controls kbd {
        background: rgba(255, 255, 255, 0.15);
        padding: 3px 10px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        margin: 0 3px;
        font-family: monospace;
        color: #fff;
      }
      .controls-pause {
        display: block;
        margin-top: 8px;
      }
      .home-link {
        display: inline-block;
        margin-top: 18px;
        padding: 8px 16px;
        border: 1px solid rgba(74, 222, 128, 0.55);
        border-radius: 8px;
        color: #94a3b8;
        background: rgba(255, 255, 255, 0.06);
        font-size: 0.9rem;
        text-decoration: none;
        transition:
          color 180ms ease,
          background 180ms ease,
          border-color 180ms ease,
          transform 180ms ease;
      }
      .home-link:hover,
      .home-link:focus-visible {
        border-color: #4ade80;
        color: #0a0a1a;
        background: #4ade80;
        outline: none;
        transform: translateY(-2px);
      }
      #overlay.show + .home-link {
        position: fixed;
        bottom: 28px;
        left: 50%;
        z-index: 11;
        margin-top: 0;
        transform: translateX(-50%);
      }
      #overlay.show + .home-link:hover,
      #overlay.show + .home-link:focus-visible {
        transform: translate(-50%, -2px);
      }
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 10;
      }
      #overlay.show {
        display: flex;
      }
      #overlay h2 {
        font-size: 3rem;
        color: #f87171;
        margin-bottom: 20px;
        text-shadow: 0 0 20px rgba(248, 113, 113, 0.5);
      }
      #overlay p {
        font-size: 1.3rem;
        margin-bottom: 30px;
      }
      #overlay button {
        background: #4ade80;
        color: #0a0a1a;
        border: none;
        padding: 14px 40px;
        font-size: 1.2rem;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s;
      }
      #overlay button:hover {
        background: #22c55e;
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(74, 222, 128, 0.6);
      }
      @media (max-width: 600px) {
        body {
          justify-content: flex-start;
          padding: 28px 0 24px;
        }
        h1 {
          font-size: 2rem;
        }
        .score-board {
          gap: 10px;
          font-size: 1rem;
        }
        .score-item {
          padding: 7px 12px;
        }
        .mobile-controls {
          display: grid;
          grid-template-columns: repeat(3, 58px);
          grid-template-rows: repeat(2, 58px);
          gap: 8px;
          justify-content: center;
          margin-top: 16px;
        }
        .mobile-controls button {
          border: 1px solid rgba(74, 222, 128, 0.55);
          border-radius: 10px;
          color: #4ade80;
          background: rgba(74, 222, 128, 0.1);
          font-size: 1.5rem;
          line-height: 1;
          cursor: pointer;
          touch-action: manipulation;
          -webkit-tap-highlight-color: transparent;
        }
        .mobile-controls button:active,
        .mobile-controls button:focus-visible {
          color: #0a0a1a;
          background: #4ade80;
          outline: none;
        }
        .mobile-controls .up {
          grid-column: 2;
        }
        .mobile-controls .left {
          grid-column: 1;
        }
        .mobile-controls .down {
          grid-column: 2;
        }
        .mobile-controls .right {
          grid-column: 3;
        }
        .controls {
          display: none;
          max-width: calc(100vw - 32px);
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <h1>🐍 Snake Game</h1>
    <div class="score-board">
      <div class="score-item">Score: <span id="score">0</span></div>
      <div class="score-item">High Score: <span id="highScore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <button
      class="pause-button"
      id="pauseBtn"
      type="button"
      aria-pressed="false">
      暂停游戏
    </button>

    <div class="mobile-controls" aria-label="移动端方向控制">
      <button
        class="up"
        type="button"
        data-direction="up"
        aria-label="向上移动">
        ↑
      </button>
      <button
        class="left"
        type="button"
        data-direction="left"
        aria-label="向左移动">
        ←
      </button>
      <button
        class="down"
        type="button"
        data-direction="down"
        aria-label="向下移动">
        ↓
      </button>
      <button
        class="right"
        type="button"
        data-direction="right"
        aria-label="向右移动">
        →
      </button>
    </div>

    <div class="controls">
      Use <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd
      ><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move
      <span class="controls-pause"
        >Press <kbd>P</kbd> or <kbd>Space</kbd> to pause / resume</span
      >
    </div>
    <div id="overlay">
      <h2>Game Over!</h2>
      <p>Your Score: <span id="finalScore">0</span></p>
      <button id="restartBtn">Play Again</button>
    </div>
    <a class="home-link" href="index.html">返回博客首页</a>

    <script>
      const canvas = document.getElementById('gameCanvas')
      const ctx = canvas.getContext('2d')
      const scoreEl = document.getElementById('score')
      const highScoreEl = document.getElementById('highScore')
      const overlay = document.getElementById('overlay')
      const finalScoreEl = document.getElementById('finalScore')
      const restartBtn = document.getElementById('restartBtn')
      const pauseBtn = document.getElementById('pauseBtn')
      const mobileControlButtons = document.querySelectorAll(
        '.mobile-controls button',
      )

      const GRID_SIZE = 20
      const TILE_COUNT = canvas.width / GRID_SIZE
      const INITIAL_SPEED = 120
      const SPEED_INCREMENT = 2
      const MIN_SPEED = 50

      let snake, food, dx, dy, score, highScore, gameLoop, speed, paused

      highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0
      highScoreEl.textContent = highScore

      function init() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 },
        ]
        dx = 1
        dy = 0
        score = 0
        speed = INITIAL_SPEED
        paused = false
        scoreEl.textContent = score
        pauseBtn.textContent = '暂停游戏'
        pauseBtn.setAttribute('aria-pressed', 'false')
        placeFood()
        overlay.classList.remove('show')
        clearInterval(gameLoop)
        gameLoop = setInterval(tick, speed)
      }

      function placeFood() {
        while (true) {
          food = {
            x: Math.floor(Math.random() * TILE_COUNT),
            y: Math.floor(Math.random() * TILE_COUNT),
          }
          if (!snake.some((s) => s.x === food.x && s.y === food.y)) break
        }
      }

      function tick() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy }

        // Wall collision
        if (
          head.x < 0 ||
          head.x >= TILE_COUNT ||
          head.y < 0 ||
          head.y >= TILE_COUNT
        ) {
          gameOver()
          return
        }

        // Self collision
        if (snake.some((s) => s.x === head.x && s.y === head.y)) {
          gameOver()
          return
        }

        snake.unshift(head)

        // Eat food
        if (head.x === food.x && head.y === food.y) {
          score += 10
          scoreEl.textContent = score
          placeFood()
          // Speed up
          if (speed > MIN_SPEED) {
            speed -= SPEED_INCREMENT
            clearInterval(gameLoop)
            gameLoop = setInterval(tick, speed)
          }
        } else {
          snake.pop()
        }

        draw()
      }

      function draw() {
        // Clear canvas
        ctx.fillStyle = '#0a0a1a'
        ctx.fillRect(0, 0, canvas.width, canvas.height)

        // Draw grid (subtle)
        ctx.strokeStyle = 'rgba(74, 222, 128, 0.05)'
        ctx.lineWidth = 1
        for (let i = 0; i <= TILE_COUNT; i++) {
          ctx.beginPath()
          ctx.moveTo(i * GRID_SIZE, 0)
          ctx.lineTo(i * GRID_SIZE, canvas.height)
          ctx.stroke()
          ctx.beginPath()
          ctx.moveTo(0, i * GRID_SIZE)
          ctx.lineTo(canvas.width, i * GRID_SIZE)
          ctx.stroke()
        }

        // Draw food
        const fx = food.x * GRID_SIZE + GRID_SIZE / 2
        const fy = food.y * GRID_SIZE + GRID_SIZE / 2
        ctx.fillStyle = '#f87171'
        ctx.shadowColor = '#f87171'
        ctx.shadowBlur = 15
        ctx.beginPath()
        ctx.arc(fx, fy, GRID_SIZE / 2 - 2, 0, Math.PI * 2)
        ctx.fill()
        ctx.shadowBlur = 0

        // Draw snake
        snake.forEach((seg, i) => {
          const x = seg.x * GRID_SIZE
          const y = seg.y * GRID_SIZE
          if (i === 0) {
            // Head
            ctx.fillStyle = '#4ade80'
            ctx.shadowColor = '#4ade80'
            ctx.shadowBlur = 10
          } else {
            // Body gradient
            const shade = 1 - (i / snake.length) * 0.5
            ctx.fillStyle = `rgba(74, 222, 128, ${shade})`
            ctx.shadowBlur = 0
          }
          roundRect(ctx, x + 1, y + 1, GRID_SIZE - 2, GRID_SIZE - 2, 5)
          ctx.fill()
        })
        ctx.shadowBlur = 0

        // Draw eyes on head
        const head = snake[0]
        const hx = head.x * GRID_SIZE
        const hy = head.y * GRID_SIZE
        ctx.fillStyle = '#0a0a1a'
        const eyeSize = 3
        let ex1, ey1, ex2, ey2
        if (dx === 1) {
          // right
          ex1 = hx + 13
          ey1 = hy + 5
          ex2 = hx + 13
          ey2 = hy + 12
        } else if (dx === -1) {
          // left
          ex1 = hx + 4
          ey1 = hy + 5
          ex2 = hx + 4
          ey2 = hy + 12
        } else if (dy === -1) {
          // up
          ex1 = hx + 5
          ey1 = hy + 4
          ex2 = hx + 12
          ey2 = hy + 4
        } else {
          // down
          ex1 = hx + 5
          ey1 = hy + 13
          ex2 = hx + 12
          ey2 = hy + 13
        }
        ctx.beginPath()
        ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2)
        ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2)
        ctx.fill()
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath()
        ctx.moveTo(x + r, y)
        ctx.lineTo(x + w - r, y)
        ctx.quadraticCurveTo(x + w, y, x + w, y + r)
        ctx.lineTo(x + w, y + h - r)
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h)
        ctx.lineTo(x + r, y + h)
        ctx.quadraticCurveTo(x, y + h, x, y + h - r)
        ctx.lineTo(x, y + r)
        ctx.quadraticCurveTo(x, y, x + r, y)
        ctx.closePath()
      }

      function gameOver() {
        clearInterval(gameLoop)
        gameLoop = null
        paused = false
        pauseBtn.textContent = '暂停游戏'
        pauseBtn.setAttribute('aria-pressed', 'false')
        finalScoreEl.textContent = score
        if (score > highScore) {
          highScore = score
          highScoreEl.textContent = highScore
          localStorage.setItem('snakeHighScore', highScore)
        }
        overlay.classList.add('show')
      }

      function togglePause() {
        if (overlay.classList.contains('show')) return
        paused = !paused
        if (paused) {
          clearInterval(gameLoop)
          gameLoop = null
          pauseBtn.textContent = '继续游戏'
          pauseBtn.setAttribute('aria-pressed', 'true')
        } else {
          gameLoop = setInterval(tick, speed)
          pauseBtn.textContent = '暂停游戏'
          pauseBtn.setAttribute('aria-pressed', 'false')
        }
      }

      function changeDirection(direction) {
        if (paused) return
        if (direction === 'up' && dy !== 1) {
          dx = 0
          dy = -1
        } else if (direction === 'down' && dy !== -1) {
          dx = 0
          dy = 1
        } else if (direction === 'left' && dx !== 1) {
          dx = -1
          dy = 0
        } else if (direction === 'right' && dx !== -1) {
          dx = 1
          dy = 0
        }
      }

      document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase()
        if (key === 'p' || key === ' ') {
          e.preventDefault()
          if (key === 'p' || !overlay.classList.contains('show')) togglePause()
          return
        }
        if (paused) return
        const directionKeys = {
          arrowup: 'up',
          w: 'up',
          arrowdown: 'down',
          s: 'down',
          arrowleft: 'left',
          a: 'left',
          arrowright: 'right',
          d: 'right',
        }
        if (directionKeys[key]) changeDirection(directionKeys[key])
        // Prevent page scroll with arrow keys
        if (
          ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)
        ) {
          e.preventDefault()
        }
      })

      pauseBtn.addEventListener('click', togglePause)
      mobileControlButtons.forEach((button) => {
        button.addEventListener('click', () => {
          changeDirection(button.dataset.direction)
        })
      })
      restartBtn.addEventListener('click', init)

      // Start the game
      init()
    </script>
  </body>
</html>
